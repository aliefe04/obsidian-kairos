name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest.version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match the manifest version '$version'. Obsidian installs the release whose tag equals manifest.version, so this release would never reach a user. Delete the tag and push '$version' instead."
            exit 1
          fi
          echo "Tag $tag matches manifest version $version"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package plugin
        id: package
        run: |
          mkdir kairos
          cp main.js manifest.json kairos
          if [ -f styles.css ]; then cp styles.css kairos; fi
          zip -r kairos.zip kairos
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.package.outputs.tag_name }}
          files: |
            main.js
            manifest.json
            kairos.zip
